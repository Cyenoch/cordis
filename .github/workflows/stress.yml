# Repeats chosen tests on one runner, to chase failures that depend on the
# machine. Started by hand: gh workflow run stress.yml -f runner=… -f run=…
name: Stress
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        default: macos-15-intel
      packages:
        description: Go packages
        default: ./hosting
      run:
        description: Test name pattern
        default: TestCallsAndStreamsWhileProvidersComeAndGo
      count:
        description: Repetitions
        default: '200'
      environment:
        description: Extra NAME=value pairs for the tests, space separated
        default: ''
      tags:
        description: Build tags
        default: ''
permissions:
  contents: read
jobs:
  stress:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/plugins/*/go.sum
      - shell: bash
        env:
          EXTRA: ${{ inputs.environment }}
          TAGS: ${{ inputs.tags }}
          COUNT: ${{ inputs.count }}
          RUN: ${{ inputs.run }}
          PACKAGES: ${{ inputs.packages }}
        # EXTRA and PACKAGES are space-separated lists, split on purpose.
        run: |
          # shellcheck disable=SC2086
          env $EXTRA go test -race -tags "$TAGS" -count="$COUNT" -run "$RUN" -timeout 50m $PACKAGES
