# Repeats chosen tests on one runner, to chase failures that depend on the
# machine. Started by hand: gh workflow run stress.yml -f runner=… -f run=…
name: Stress
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        default: macos-15-intel
      packages:
        description: Go packages
        default: ./hosting
      run:
        description: Test name pattern
        default: TestCallsAndStreamsWhileProvidersComeAndGo
      count:
        description: Repetitions
        default: '200'
      environment:
        description: Extra NAME=value pairs for the tests, space separated
        default: ''
      tags:
        description: Build tags
        default: ''
permissions:
  contents: read
jobs:
  stress:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: bash
        run: env ${{ inputs.environment }} go test -race -tags '${{ inputs.tags }}' -count=${{ inputs.count }} -run '${{ inputs.run }}' -timeout 50m ${{ inputs.packages }}
