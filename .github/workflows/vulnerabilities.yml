name: Vulnerabilities

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: |
          for module in examples/plugins/*/; do
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
          done
