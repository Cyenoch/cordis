[[services]]
name = "example.feed"
version = 1

# A streaming method: the response describes one item of the sequence.
[[services.methods]]
name = "tail"
stream = true
request = { type = "object", properties = { count = { type = "integer", minimum = 0 } }, required = ["count"] }
response = { type = "object", properties = { line = { type = "string" } }, required = ["line"] }

[[definitions]]
id = "feed"
provides = ["example.feed"]
